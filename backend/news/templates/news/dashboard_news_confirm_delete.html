{% extends "news/base.html" %}
{% block header_title %}Delete News{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-10">
    <div class="glass-panel rounded-3xl shadow-xl p-8 sm:p-10 bg-white text-center border border-red-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-red-500"></div>
        
        <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
            <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center">
                <i data-lucide="alert-triangle" class="w-8 h-8 text-red-500"></i>
            </div>
        </div>
        
        <h3 class="text-2xl font-bold text-gray-900 mb-3">{{ t.confirm_delete }}</h3>
        <p class="text-gray-500 mb-8 leading-relaxed">{{ t.delete_news_msg }}<br><strong class="text-gray-800">"{{ object.title }}"</strong>?</p>
        
        <form method="post" class="flex flex-col sm:flex-row justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'dashboard-news-list' %}" class="px-6 py-3.5 border border-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-50 transition-colors w-full sm:w-auto">{{ t.cancel }}</a>
            <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3.5 rounded-xl font-bold shadow-md hover:shadow-lg transition-all flex items-center justify-center w-full sm:w-auto">
                <i data-lucide="trash-2" class="w-5 h-5 mr-2"></i> {{ t.yes_delete }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
