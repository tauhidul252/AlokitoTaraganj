{% extends "news/base.html" %}
{% block header_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto py-12">
    <div class="glass-panel rounded-3xl shadow-xl border border-red-100 overflow-hidden bg-white">
        <div class="p-8 sm:p-12 text-center">
            <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500">
                <i data-lucide="user-x" class="w-10 h-10"></i>
            </div>
            <h3 class="text-2xl font-bold text-gray-900 mb-3">{{ t.confirm_delete }}</h3>
            <p class="text-gray-500 mb-8">{{ t.delete_user_msg }} <span class="font-bold text-gray-800">"{{ object.username }}"</span></p>
            
            <form method="post">
                {% csrf_token %}
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="{% url 'dashboard-user-list' %}" class="px-8 py-3 border border-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-50 transition-colors order-2 sm:order-1">
                        {{ t.no_keep }}
                    </a>
                    <button type="submit" class="px-8 py-3 bg-red-600 text-white rounded-xl font-bold shadow-lg shadow-red-200 hover:bg-red-700 transform hover:-translate-y-0.5 transition-all order-1 sm:order-2">
                        {{ t.yes_delete }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
